<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TV 대시보드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: grid;
            grid-template-columns: 500px 1fr;
            height: 100vh;
            gap: 20px;
            padding: 20px;
        }

        .widget-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
        }

        .widget {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .widget:hover, .widget:focus-within {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.2);
        }

        .widget::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .widget:hover::before, .widget:focus-within::before {
            opacity: 1;
        }

        .clock-widget {
            text-align: center;
        }

        .time {
            font-size: 64px;
            font-weight: 300;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            margin-bottom: 10px;
        }

        .date {
            font-size: 24px;
            color: #888;
            margin-bottom: 10px;
        }

        .day {
            font-size: 20px;
            color: #7c3aed;
        }

        .weather-widget h3 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .temperature {
            font-size: 48px;
            font-weight: bold;
            color: white;
        }

        .weather-icon {
            font-size: 48px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .weather-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .weather-label {
            font-size: 16px;
            color: #888;
            margin-bottom: 5px;
        }

        .weather-value {
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        .air-quality {
            margin-top: 15px;
            padding: 15px;
            background: rgba(124, 58, 237, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(124, 58, 237, 0.3);
        }

        .aqi-value {
            font-size: 24px;
            font-weight: bold;
            color: #7c3aed;
        }

        .news-widget h3 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        .news-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .news-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border-left: 3px solid #7c3aed;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .news-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .news-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: white;
        }

        .news-summary {
            font-size: 16px;
            color: #ccc;
            line-height: 1.4;
        }

        .chat-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 30px;
        }

        .chat-title {
            font-size: 36px;
            font-weight: bold;
            color: #00d4ff;
        }

        .settings-btn {
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid #7c3aed;
            color: #7c3aed;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: auto;
        }

        .settings-btn:hover, .settings-btn:focus {
            background: #7c3aed;
            color: white;
            transform: scale(1.05);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px;
            margin-bottom: 20px;
            max-height: calc(100vh - 300px);
        }

        .message {
            margin-bottom: 20px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .message.assistant {
            display: flex;
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 20px 25px;
            border-radius: 20px;
            font-size: 20px;
            line-height: 1.5;
            position: relative;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.assistant .message-content {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-bottom-left-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chat-input-container {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            font-size: 20px;
            resize: none;
            min-height: 60px;
            max-height: 120px;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .chat-input::placeholder {
            color: #888;
        }

        .send-btn {
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            border: none;
            color: white;
            padding: 20px 25px;
            border-radius: 15px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 80px;
        }

        .send-btn:hover, .send-btn:focus {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .settings-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .settings-content {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .settings-title {
            font-size: 32px;
            color: #00d4ff;
        }

        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .setting-group {
            margin-bottom: 30px;
        }

        .setting-label {
            font-size: 20px;
            color: white;
            margin-bottom: 10px;
            display: block;
        }

        .setting-input, .setting-select {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .setting-input:focus, .setting-select:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .setting-select option {
            background: #1a1a2e;
            color: white;
        }

        .save-btn {
            width: 100%;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.3);
        }

        .loading {
            display: none;
            text-align: center;
            color: #00d4ff;
            font-size: 18px;
            padding: 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-top: 2px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 키보드 포커스 스타일 (리모컨 사용) */
        button:focus, input:focus, textarea:focus, select:focus {
            outline: 3px solid #00d4ff;
            outline-offset: 2px;
        }

        /* 반응형 */
        @media (max-width: 1400px) {
            .container {
                grid-template-columns: 400px 1fr;
            }
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
            
            .widget-panel {
                flex-direction: row;
                overflow-x: auto;
            }
            
            .widget {
                min-width: 300px;
            }
        }

        .status-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            backdrop-filter: blur(10px);
            z-index: 100;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
        }

        .status-indicator.show {
            opacity: 1;
            transform: translateY(0);
        }

        .typing-indicator {
            display: none;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            border-bottom-left-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 70%;
        }

        .typing-dots {
            display: inline-block;
        }

        .typing-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00d4ff;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.5s ease-in-out infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.3;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="status-indicator" id="statusIndicator"></div>
    
    <div class="container">
        <!-- 왼쪽 위젯 패널 -->
        <div class="widget-panel">
            <!-- 시계 위젯 -->
            <div class="widget clock-widget">
                <div class="time" id="timeDisplay">00:00:00</div>
                <div class="date" id="dateDisplay">2024년 1월 1일</div>
                <div class="day" id="dayDisplay">월요일</div>
            </div>

            <!-- 날씨 위젯 -->
            <div class="widget weather-widget">
                <h3>🌤️ 날씨 정보</h3>
                <div class="weather-main">
                    <div class="temperature" id="temperature">--°C</div>
                    <div class="weather-icon" id="weatherIcon">🌤️</div>
                </div>
                <div class="weather-details">
                    <div class="weather-item">
                        <div class="weather-label">습도</div>
                        <div class="weather-value" id="humidity">--%</div>
                    </div>
                    <div class="weather-item">
                        <div class="weather-label">바람</div>
                        <div class="weather-value" id="windSpeed">-- km/h</div>
                    </div>
                    <div class="weather-item">
                        <div class="weather-label">강수확률</div>
                        <div class="weather-value" id="precipitation">--%</div>
                    </div>
                    <div class="weather-item">
                        <div class="weather-label">체감온도</div>
                        <div class="weather-value" id="feelsLike">--°C</div>
                    </div>
                </div>
                <div class="air-quality">
                    <div class="weather-label">🏭 대기질 지수</div>
                    <div class="aqi-value" id="aqiValue">--</div>
                    <div style="font-size: 16px; margin-top: 5px;">
                        PM2.5: <span id="pm25">--</span> µg/m³ | PM10: <span id="pm10">--</span> µg/m³
                    </div>
                </div>
            </div>

            <!-- AI 뉴스 위젯 -->
            <div class="widget news-widget">
                <h3>📰 AI 뉴스</h3>
                <div class="news-items" id="newsItems">
                    <div class="news-item">
                        <div class="news-title">AI 뉴스를 불러오는 중...</div>
                        <div class="news-summary">최신 AI 및 기술 뉴스를 준비하고 있습니다.</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 오른쪽 채팅 패널 -->
        <div class="chat-panel">
            <div class="chat-header">
                <div class="chat-title">💬 AI 어시스턴트</div>
                <button class="settings-btn" id="settingsBtn">⚙️ 설정</button>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="message-content">
                        안녕하세요! AI 어시스턴트입니다. 무엇을 도와드릴까요? 💙
                    </div>
                </div>
            </div>
            
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span style="margin-left: 10px; color: #888;">AI가 생각 중...</span>
            </div>
            
            <div class="chat-input-container">
                <textarea class="chat-input" id="chatInput" placeholder="메시지를 입력하세요..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn">전송</button>
            </div>
        </div>
    </div>

    <!-- 설정 패널 -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-content">
            <div class="settings-header">
                <div class="settings-title">⚙️ 설정</div>
                <button class="close-btn" id="closeSettingsBtn">✕</button>
            </div>
            
            <div class="setting-group">
                <label class="setting-label">OpenAI API Key</label>
                <input type="password" class="setting-input" id="apiKeyInput" placeholder="sk-...">
            </div>
            
            <div class="setting-group">
                <label class="setting-label">AI 모델</label>
                <select class="setting-select" id="modelSelect">
                    <option value="gpt-4">GPT-4</option>
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                    <option value="gpt-4-turbo">GPT-4 Turbo</option>
                </select>
            </div>
            
            <div class="setting-group">
                <label class="setting-label">위치 (위도)</label>
                <input type="number" class="setting-input" id="latitudeInput" placeholder="37.55" step="0.01">
            </div>
            
            <div class="setting-group">
                <label class="setting-label">위치 (경도)</label>
                <input type="number" class="setting-input" id="longitudeInput" placeholder="126.85" step="0.01">
            </div>
            
            <button class="save-btn" id="saveSettingsBtn">저장</button>
        </div>
    </div>

    <script>
        // 전역 변수
        let settings = {
            apiKey: localStorage.getItem('openai_api_key') || '',
            model: localStorage.getItem('ai_model') || 'gpt-3.5-turbo',
            latitude: parseFloat(localStorage.getItem('latitude')) || 37.55,
            longitude: parseFloat(localStorage.getItem('longitude')) || 126.85
        };

        let chatHistory = [];
        let newsData = [];

        // DOM 요소들
        const timeDisplay = document.getElementById('timeDisplay');
        const dateDisplay = document.getElementById('dateDisplay');
        const dayDisplay = document.getElementById('dayDisplay');
        const temperature = document.getElementById('temperature');
        const weatherIcon = document.getElementById('weatherIcon');
        const humidity = document.getElementById('humidity');
        const windSpeed = document.getElementById('windSpeed');
        const precipitation = document.getElementById('precipitation');
        const feelsLike = document.getElementById('feelsLike');
        const aqiValue = document.getElementById('aqiValue');
        const pm25 = document.getElementById('pm25');
        const pm10 = document.getElementById('pm10');
        const newsItems = document.getElementById('newsItems');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const modelSelect = document.getElementById('modelSelect');
        const latitudeInput = document.getElementById('latitudeInput');
        const longitudeInput = document.getElementById('longitudeInput');
        const statusIndicator = document.getElementById('statusIndicator');
        const typingIndicator = document.getElementById('typingIndicator');

        // 시계 업데이트
        function updateClock() {
            const now = new Date();
            const days = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
            
            timeDisplay.textContent = now.toLocaleTimeString('ko-KR', { hour12: false });
            dateDisplay.textContent = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일`;
            dayDisplay.textContent = days[now.getDay()];
        }

        // 날씨 아이콘 매핑
        function getWeatherIcon(code) {
            const iconMap = {
                0: '☀️', // Clear sky
                1: '🌤️', // Mainly clear
                2: '⛅', // Partly cloudy
                3: '☁️', // Overcast
                45: '🌫️', // Fog
                48: '🌫️', // Depositing rime fog
                51: '🌦️', // Drizzle light
                53: '🌦️', // Drizzle moderate
                55: '🌦️', // Drizzle dense
                61: '🌧️', // Rain slight
                63: '🌧️', // Rain moderate
                65: '🌧️', // Rain heavy
                71: '🌨️', // Snow fall slight
                73: '🌨️', // Snow fall moderate
                75: '🌨️', // Snow fall heavy
                77: '❄️', // Snow grains
                80: '🌦️', // Rain showers slight
                81: '🌦️', // Rain showers moderate
                82: '🌦️', // Rain showers violent
                85: '🌨️', // Snow showers slight
                86: '🌨️', // Snow showers heavy
                95: '⛈️', // Thunderstorm
                96: '⛈️', // Thunderstorm with hail
                99: '⛈️'  // Thunderstorm with heavy hail
            };
            return iconMap[code] || '🌤️';
        }

        // 날씨 정보 업데이트
        async function updateWeather() {
            try {
                showStatus('날씨 정보 업데이트 중...', 'info');
                
                // 날씨 정보 가져오기
                const weatherResponse = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${settings.latitude}&longitude=${settings.longitude}&current_weather=true&hourly=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation_probability,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia/Seoul&forecast_days=1`
                );
                const weatherData = await weatherResponse.json();

                // 대기질 정보 가져오기
                const airResponse = await fetch(
                    `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${settings.latitude}&longitude=${settings.longitude}&current=pm10,pm2_5,us_aqi&timezone=Asia/Seoul`
                );
                const airData = await airResponse.json();

                // 날씨 정보 표시
                const current = weatherData.current_weather;
                const hourly = weatherData.hourly;
                const currentHour = new Date().getHours();
                
                temperature.textContent = `${Math.round(current.temperature)}°C`;
                weatherIcon.textContent = getWeatherIcon(current.weathercode);
                
                // 현재 시간의 상세 정보
                if (hourly) {
                    humidity.textContent = `${Math.round(hourly.relative_humidity_2m[currentHour])}%`;
                    windSpeed.textContent = `${Math.round(current.windspeed)} km/h`;
                    precipitation.textContent = `${Math.round(hourly.precipitation_probability[currentHour] || 0)}%`;
                    feelsLike.textContent = `${Math.round(hourly.apparent_temperature[currentHour])}°C`;
                }

                // 대기질 정보 표시
                if (airData.current) {
                    const aqi = airData.current.us_aqi || 0;
                    aqiValue.textContent = getAQILevel(aqi);
                    aqiValue.style.color = getAQIColor(aqi);
                    pm25.textContent = Math.round(airData.current.pm2_5 || 0);
                    pm10.textContent = Math.round(airData.current.pm10 || 0);
                }

                showStatus('날씨 정보 업데이트 완료', 'success');
            } catch (error) {
                console.error('날씨 정보 업데이트 실패:', error);
                showStatus('날씨 정보 업데이트 실패', 'error');
            }
        }

        // 대기질 레벨 텍스트
        function getAQILevel(aqi) {
            if (aqi <= 50) return `${aqi} 좋음`;
            if (aqi <= 100) return `${aqi} 보통`;
            if (aqi <= 150) return `${aqi} 나쁨`;
            if (aqi <= 200) return `${aqi} 매우나쁨`;
            if (aqi <= 300) return `${aqi} 위험`;
            return `${aqi} 최악`;
        }

        // 대기질 색상
        function getAQIColor(aqi) {
            if (aqi <= 50) return '#00d4ff';
            if (aqi <= 100) return '#7c3aed';
            if (aqi <= 150) return '#fbbf24';
            if (aqi <= 200) return '#f97316';
            if (aqi <= 300) return '#ef4444';
            return '#991b1b';
        }

        // AI 뉴스 생성
        async function generateAINews() {
            if (!settings.apiKey) {
                newsItems.innerHTML = `
                    <div class="news-item">
                        <div class="news-title">API 키가 필요합니다</div>
                        <div class="news-summary">설정에서 OpenAI API 키를 입력해주세요.</div>
                    </div>
                `;
                return;
            }

            try {
                showStatus('AI 뉴스 생성 중...', 'info');
                
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${settings.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: settings.model,
                        messages: [
                            {
                                role: 'system',
                                content: '당신은 기술 및 AI 뉴스 전문 기자입니다. 최신 AI, 기술, 과학 동향에 대한 흥미로운 뉴스 3개를 생성해주세요. 각 뉴스는 제목과 2-3줄 요약으로 구성되어야 합니다. JSON 형식으로 응답해주세요.'
                            },
                            {
                                role: 'user',
                                content: `오늘은 ${new Date().toLocaleDateString('ko-KR')}입니다. 최신 AI 및 기술 뉴스 3개를 다음 JSON 형식으로 생성해주세요: {"news": [{"title": "제목", "summary": "요약"}]}`
                            }
                        ],
                        max_tokens: 1000,
                        temperature: 0.8
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const newsContent = data.choices[0].message.content;
                let newsJson;
                
                try {
                    newsJson = JSON.parse(newsContent);
                } catch {
                    // JSON 파싱 실패시 기본 뉴스 제공
                    newsJson = {
                        news: [
                            {
                                title: "AI 기술의 혁신적 발전",
                                summary: "최신 AI 모델들이 새로운 성능 기록을 달성하며 다양한 분야에서 활용되고 있습니다."
                            },
                            {
                                title: "스마트 기술의 일상 적용",
                                summary: "IoT와 스마트 홈 기술이 우리 생활을 더욱 편리하게 만들어가고 있습니다."
                            },
                            {
                                title: "미래 기술 전망",
                                summary: "양자컴퓨팅과 블록체인 등 차세대 기술들의 발전이 주목받고 있습니다."
                            }
                        ]
                    };
                }

                newsData = newsJson.news || [];
                displayNews();
                showStatus('AI 뉴스 생성 완료', 'success');
                
            } catch (error) {
                console.error('뉴스 생성 실패:', error);
                newsItems.innerHTML = `
                    <div class="news-item">
                        <div class="news-title">뉴스 생성 실패</div>
                        <div class="news-summary">API 키를 확인하거나 잠시 후 다시 시도해주세요.</div>
                    </div>
                `;
                showStatus('뉴스 생성 실패', 'error');
            }
        }

        // 뉴스 표시
        function displayNews() {
            if (newsData.length === 0) return;
            
            const newsHtml = newsData.map(news => `
                <div class="news-item">
                    <div class="news-title">${news.title}</div>
                    <div class="news-summary">${news.summary}</div>
                </div>
            `).join('');
            
            newsItems.innerHTML = newsHtml;
        }

        // 채팅 메시지 추가
        function addMessage(content, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `
                <div class="message-content">${content}</div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // AI 채팅 응답
        async function sendChatMessage(message) {
            if (!settings.apiKey) {
                addMessage('설정에서 OpenAI API 키를 입력해주세요.', 'assistant');
                return;
            }

            try {
                typingIndicator.style.display = 'block';
                sendBtn.disabled = true;
                sendBtn.textContent = '전송 중...';

                chatHistory.push({ role: 'user', content: message });

                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${settings.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: settings.model,
                        messages: [
                            {
                                role: 'system',
                                content: '당신은 친근하고 도움이 되는 AI 어시스턴트입니다. 한국어로 대화하며, 사용자의 질문에 정확하고 유용한 답변을 제공합니다.'
                            },
                            ...chatHistory.slice(-10) // 최근 10개 메시지만 유지
                        ],
                        max_tokens: 1000,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiResponse = data.choices[0].message.content;
                chatHistory.push({ role: 'assistant', content: aiResponse });
                
                typingIndicator.style.display = 'none';
                addMessage(aiResponse, 'assistant');

            } catch (error) {
                console.error('채팅 오류:', error);
                typingIndicator.style.display = 'none';
                addMessage('죄송합니다. 오류가 발생했습니다. API 키를 확인하거나 잠시 후 다시 시도해주세요.', 'assistant');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '전송';
            }
        }

        // 상태 메시지 표시
        function showStatus(message, type) {
            statusIndicator.textContent = message;
            statusIndicator.className = `status-indicator show ${type}`;
            
            setTimeout(() => {
                statusIndicator.classList.remove('show');
            }, 3000);
        }

        // 설정 로드
        function loadSettings() {
            apiKeyInput.value = settings.apiKey;
            modelSelect.value = settings.model;
            latitudeInput.value = settings.latitude;
            longitudeInput.value = settings.longitude;
        }

        // 설정 저장
        function saveSettings() {
            settings.apiKey = apiKeyInput.value.trim();
            settings.model = modelSelect.value;
            settings.latitude = parseFloat(latitudeInput.value) || 37.55;
            settings.longitude = parseFloat(longitudeInput.value) || 126.85;

            localStorage.setItem('openai_api_key', settings.apiKey);
            localStorage.setItem('ai_model', settings.model);
            localStorage.setItem('latitude', settings.latitude.toString());
            localStorage.setItem('longitude', settings.longitude.toString());

            showStatus('설정이 저장되었습니다', 'success');
            settingsPanel.style.display = 'none';
            
            // 위치가 변경되었으면 날씨 업데이트
            updateWeather();
        }

        // 이벤트 리스너
        settingsBtn.addEventListener('click', () => {
            loadSettings();
            settingsPanel.style.display = 'flex';
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsPanel.style.display = 'none';
        });

        saveSettingsBtn.addEventListener('click', saveSettings);

        sendBtn.addEventListener('click', async () => {
            const message = chatInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            chatInput.value = '';
            chatInput.style.height = '60px';
            
            await sendChatMessage(message);
        });

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        // 텍스트 영역 자동 크기 조절
        chatInput.addEventListener('input', () => {
            chatInput.style.height = '60px';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        });

        // 설정 패널 외부 클릭시 닫기
        settingsPanel.addEventListener('click', (e) => {
            if (e.target === settingsPanel) {
                settingsPanel.style.display = 'none';
            }
        });

        // 키보드 네비게이션 (리모컨 사용)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                settingsPanel.style.display = 'none';
            }
        });

        // 초기화
        function initialize() {
            updateClock();
            updateWeather();
            generateAINews();
            
            // 주기적 업데이트
            setInterval(updateClock, 1000);
            setInterval(updateWeather, 10 * 60 * 1000); // 10분마다
            setInterval(generateAINews, 30 * 60 * 1000); // 30분마다
            
            showStatus('TV 대시보드가 준비되었습니다', 'success');
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
